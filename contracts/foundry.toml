[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# openPosition carries more locals than the legacy codegen can hold on stack.
via_ir = true
# Robinhood Chain follows post-Shanghai EVM rules.
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 4
